<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sentinel Learning — Plataforma de estudos" />
  <title>Sentinel Learning</title>

  <!-- Prevent flash of wrong theme -->
  <script>
    (function () {
      var saved = localStorage.getItem('sl_theme');
      var preferLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved || (preferLight ? 'light' : 'dark'));
    }());
  </script>

  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/utilities.css" />
</head>
<body>

  <div class="app">

    <!-- ─── Sidebar ─── -->
    <aside
      id="sidebar"
      class="sidebar"
      role="navigation"
      aria-label="Menu principal"
      aria-expanded="true"
    >

      <div class="sidebar__header">
        <a class="sidebar__logo" href="#/dashboard" aria-label="Sentinel Learning — Início">
          <div class="sidebar__logo-icon" aria-hidden="true">◈</div>
          <span class="sidebar__logo-text">Sentinel Learning</span>
        </a>
        <button
          id="sidebar-toggle"
          class="sidebar__toggle"
          aria-label="Recolher menu"
          title="Recolher menu"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar__nav" aria-label="Navegação">

        <!-- ─── Principal ─── -->
        <div class="nav-section">
          <div class="nav-section__label">Principal</div>

          <a class="nav-item" href="#/dashboard" data-route="/dashboard" data-label="Minha Jornada">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 1L9.8 5.6L15 6.4L11.5 9.8L12.6 15L8 12.5L3.4 15L4.5 9.8L1 6.4L6.2 5.6L8 1Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="nav-item__label">Minha Jornada</span>
          </a>

          <a class="nav-item" href="#/modules" data-route="/modules" data-label="Módulos">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2.5 4H13.5M2.5 8H13.5M2.5 12H8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="nav-item__label">Módulos</span>
          </a>

          <a class="nav-item" href="#/courses" data-route="/courses" data-label="Todos os Cursos">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="1" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
                <rect x="9.5" y="1" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
                <rect x="1" y="9.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
                <rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </span>
            <span class="nav-item__label">Todos os Cursos</span>
          </a>
        </div>

        <!-- ─── Cursos (Favoritos) ─── -->
        <div class="nav-section">
          <div class="nav-section__label">Cursos</div>
          <div id="sidebar-favorites-list">
            <!-- populated dynamically by _updateSidebarFavorites() -->
            <div class="nav-favorites-empty">
              <span class="nav-favorites-empty__icon" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                  <path d="M8 1L9.8 5.6L15 6.4L11.5 9.8L12.6 15L8 12.5L3.4 15L4.5 9.8L1 6.4L6.2 5.6L8 1Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <span>Favorite um curso para acesso rápido</span>
            </div>
          </div>
          <a class="nav-item nav-item--catalog" href="#/courses" data-route="/courses" data-label="Todos os Cursos">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M3 5h10M3 8h7M3 11h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="nav-item__label">Todos os Cursos</span>
            <span class="nav-item__soon" style="color:var(--color-accent);border-color:rgba(0,212,170,0.3)">8</span>
          </a>
        </div>

        <!-- ─── Rendimento ─── -->
        <div class="nav-section">
          <div class="nav-section__label">Rendimento</div>

          <a class="nav-item" href="#/progress" data-route="/progress" data-label="Progresso">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M1 12L5 7L8 10L11 5L15 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M1 14H15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="nav-item__label">Progresso</span>
          </a>

          <a class="nav-item" href="#/achievements" data-route="/achievements" data-label="Conquistas">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 11C10.2 11 12 9.2 12 7C12 4.8 10.2 3 8 3C5.8 3 4 4.8 4 7C4 9.2 5.8 11 8 11Z" stroke="currentColor" stroke-width="1.4"/>
                <path d="M5.5 10.2L4.5 14L8 12.5L11.5 14L10.5 10.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="nav-item__label">Conquistas</span>
          </a>
        </div>

        <!-- ─── Sistema ─── -->
        <div class="nav-section">
          <div class="nav-section__label">Sistema</div>

          <a class="nav-item" href="#/settings" data-route="/settings" data-label="Configurações">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.4"/>
                <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M2.9 2.9l1.06 1.06M12.04 12.04l1.06 1.06M2.9 13.1l1.06-1.06M12.04 3.96l1.06-1.06" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="nav-item__label">Configurações</span>
          </a>

          <a class="nav-item" href="pages/admin.html" data-label="Admin">
            <span class="nav-item__icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 1L9.6 2.6H13.4V6.4L15 8L13.4 9.6V13.4H9.6L8 15L6.4 13.4H2.6V9.6L1 8L2.6 6.4V2.6H6.4L8 1Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.4"/>
              </svg>
            </span>
            <span class="nav-item__label">Admin</span>
          </a>
        </div>

      </nav>

      <div class="sidebar__footer">
        <div class="sidebar__user" tabindex="0" role="button" aria-label="Perfil do usuário">
          <div class="sidebar__avatar" aria-hidden="true">RC</div>
          <div class="sidebar__user-info">
            <div class="sidebar__user-name">Rapha Castilho</div>
            <div class="sidebar__user-role">QA Engineer</div>
          </div>
        </div>
      </div>

    </aside>

    <!-- ─── Overlay (mobile) ─── -->
    <div id="sidebar-overlay" class="sidebar-overlay" role="presentation"></div>

    <!-- ─── Main Wrapper ─── -->
    <div id="main-wrapper" class="main-wrapper">

      <!-- ─── Header ─── -->
      <header class="header" role="banner">
        <div class="header__left">
          <button
            id="mobile-menu-toggle"
            class="sidebar__toggle"
            aria-label="Abrir menu"
            style="display:none"
          >
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M2 4H16M2 9H16M2 14H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <h1 class="header__title" id="page-title">Minha Jornada</h1>
        </div>
        <div class="header__right">
          <button
            id="reset-progress"
            class="button button--ghost button--sm"
            aria-label="Resetar progresso de desenvolvimento"
            title="Resetar progresso (dev)"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M1.5 7A5.5 5.5 0 107 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M1.5 3.5v3.5h3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Ativar modo claro"
            aria-pressed="true"
            title="Alternar tema"
          >
            <svg class="theme-toggle__icon theme-toggle__icon--dark" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
              <path d="M13.5 9.5A6.5 6.5 0 015 1 7 7 0 1013.5 9.5z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="theme-toggle__icon theme-toggle__icon--light" width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
              <circle cx="7.5" cy="7.5" r="2.8" stroke="currentColor" stroke-width="1.4"/>
              <path d="M7.5 1v1.5M7.5 12.5V14M1 7.5h1.5M12.5 7.5H14M3.05 3.05l1.06 1.06M10.89 10.89l1.06 1.06M3.05 11.95l1.06-1.06M10.89 4.11l1.06-1.06" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
            <span class="theme-toggle__label" aria-hidden="true">Dark</span>
          </button>
          <span class="badge badge-primary">v2.0</span>
        </div>
      </header>

      <!-- ─── Main Content ─── -->
      <main id="main" class="main" role="main" aria-labelledby="page-title" aria-busy="false">
        <div id="dashboard-status" class="sr-only" aria-live="polite" aria-atomic="true"></div>
        <div id="dashboard-error" class="is-hidden" role="alert"></div>
        <div id="app-view" class="app-view"></div>
      </main>

    </div>

  </div>

  <!-- Toast notifications -->
  <div
    id="toast-region"
    class="toast-region"
    aria-live="polite"
    aria-atomic="false"
    role="status"
  ></div>

  <script src="js/english-storage.js"></script>
  <script src="js/english-data.js"></script>
  <script src="js/data/courses.js"></script>
  <script src="js/data/english.js"></script>
  <script src="js/data/qa/lessons-qa-m1.js"></script>
  <script src="js/data/qa/lessons-qa-m2.js"></script>
  <script src="js/data/qa/lessons-qa-m3.js"></script>
  <script src="js/data/qa/lessons-qa-m4.js"></script>
  <script src="js/data/qa/lessons-qa-m5.js"></script>
  <script src="js/data/qa/lessons-qa-m6.js"></script>
  <script src="js/data/qa/lessons-qa-m7.js"></script>
  <script src="js/data/qa-foundation.js"></script>
  <script src="js/data/js/lessons-m1.js"></script>
  <script src="js/data/js/lessons-m2.js"></script>
  <script src="js/data/js/lessons-m3.js"></script>
  <script src="js/data/js/lessons-m4.js"></script>
  <script src="js/data/js/lessons-m5.js"></script>
  <script src="js/data/js/lessons-m6.js"></script>
  <script src="js/data/js/lessons-m7.js"></script>
  <script src="js/data/javascript-foundation.js"></script>
  <script src="js/data/playwright.js"></script>
  <script src="js/data/frontend-foundation.js"></script>
  <script src="js/data/jira-jql.js"></script>
  <script src="js/data/git-github.js"></script>
  <script src="js/data/web-fundamentals.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
